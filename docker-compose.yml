services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goat
      POSTGRES_PASSWORD: goat
      POSTGRES_DB: goat
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U goat -d goat]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://goat:goat@db:5432/goat
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
volumes:
  data:
