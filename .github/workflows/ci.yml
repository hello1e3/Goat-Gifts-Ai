name: Verify GOAT Gifts AI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goat
          POSTGRES_PASSWORD: goat
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goat -d goat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://goat:goat@127.0.0.1:5432/goat
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: docker build -t goat-gifts-ai:ci .
